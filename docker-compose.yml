# OrbStack / Docker Compose — run from the monorepo root:
#   docker compose up --build
#
# Paths are relative only (no host-absolute mounts). Bind-mounts the repo so
# packages/mast-blocks is visible to both apps; node_modules come from the image.

services:
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - '3001:3001'
    volumes:
      - .:/app
      - frontend_node_modules:/app/node_modules
      # Keep host nested node_modules from shadowing the image install
      - /app/frontend/node_modules
      - /app/studio/node_modules
      - /app/packages/mast-blocks/node_modules
      - /app/astro-app/node_modules
    env_file:
      - path: .env
        required: false
      - path: frontend/.env.local
        required: false
    working_dir: /app

  studio:
    build:
      context: .
      dockerfile: studio/Dockerfile
    ports:
      - '3334:3334'
    volumes:
      - .:/app
      - studio_node_modules:/app/node_modules
      - /app/frontend/node_modules
      - /app/studio/node_modules
      - /app/packages/mast-blocks/node_modules
      - /app/astro-app/node_modules
    env_file:
      - path: .env
        required: false
      - path: studio/.env
        required: false
    working_dir: /app
    environment:
      # Presentation / Claude assistant call the host-published frontend
      SANITY_STUDIO_PREVIEW_URL: ${SANITY_STUDIO_PREVIEW_URL:-http://localhost:3001}

volumes:
  frontend_node_modules:
  studio_node_modules:
